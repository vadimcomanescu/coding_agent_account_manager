name: Sync upstream into integration

# Keeps this fork current with Dicklesworthstone/coding_agent_account_manager:
#   main        = exact mirror of upstream/main (fast-forward only)
#   integration = upstream/main + every fix/* branch not yet merged upstream
# Runs daily and on demand. A merge conflict fails the run and opens an issue
# instead of guessing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.4"

      - name: Configure git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Dicklesworthstone/coding_agent_account_manager.git
          git fetch upstream main
          git fetch origin

      - name: Mirror upstream/main into main (fast-forward only)
        run: |
          git push origin upstream/main:refs/heads/main

      - name: Rebuild integration = upstream/main + open fix branches
        id: merge
        run: |
          set -euo pipefail
          git checkout -B integration upstream/main
          # Keep the fork-only files that live on integration (this workflow).
          git checkout origin/integration -- .github/workflows/sync-upstream.yml
          git commit -qm "chore(fork): carry sync workflow on integration" || true
          merged=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/fix/); do
            branch="${ref#origin/}"
            if git merge-base --is-ancestor "$ref" upstream/main; then
              echo "already upstream: $branch"; continue
            fi
            if git merge --no-edit "$ref"; then
              merged="$merged $branch"
            else
              git merge --abort
              echo "conflict=$branch" >> "$GITHUB_OUTPUT"
              echo "::error::merge conflict on $branch"
              exit 1
            fi
          done
          echo "merged:$merged"

      - name: Build and test integration
        run: |
          go build ./cmd/caam
          go test ./...

      - name: Push integration
        run: git push --force-with-lease origin integration

      - name: Open issue on conflict
        if: failure() && steps.merge.outputs.conflict != ''
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.merge.outputs.conflict }}';
            const title = `fork-sync: conflict merging ${branch} onto upstream/main`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'fork-sync' });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['fork-sync'],
              body: `The scheduled upstream sync could not merge \`${branch}\` onto the current upstream/main. Rebase the branch and re-run the workflow.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
