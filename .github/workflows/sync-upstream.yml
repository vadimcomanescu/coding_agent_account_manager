name: Sync upstream into integration

# Keeps this fork current with Dicklesworthstone/coding_agent_account_manager:
#   main        = exact mirror of upstream/main (fast-forward only)
#   integration = main + every fix/* and feat/* branch not yet merged upstream
# Runs daily (04:17 UTC) and on demand via workflow_dispatch.
# The merge is incremental: upstream/main and any new fix/* branch are merged
# INTO the existing integration branch, so resolutions already recorded there
# are kept. A conflict fails the run and opens an issue instead of guessing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          # The mirror step pushes upstream/main, which carries
          # .github/workflows/ci.yml, into main. The default GITHUB_TOKEN may
          # not create or update workflow files, so that push is rejected
          # unless SYNC_TOKEN holds a fine-grained token with the workflow
          # scope (contents: write, workflows: write) on this repository.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Configure git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Dicklesworthstone/coding_agent_account_manager.git
          git fetch upstream main
          git fetch origin

      - name: Mirror upstream/main into main (fast-forward only)
        run: git push origin upstream/main:refs/heads/main

      - name: Merge upstream/main and new fix branches into integration
        id: merge
        run: |
          set -euo pipefail
          merge_or_fail() {
            local ref="$1"
            if git merge-base --is-ancestor "$ref" HEAD; then echo "already in integration: $ref"; return 0; fi
            if git merge --no-edit "$ref"; then echo "merged: $ref"; else
              git merge --abort
              echo "conflict=$ref" >> "$GITHUB_OUTPUT"
              echo "::error::merge conflict on $ref"
              exit 1
            fi
          }
          merge_or_fail upstream/main
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/fix/ refs/remotes/origin/feat/); do
            merge_or_fail "$ref"
          done

      - name: Build and test integration
        run: |
          go build ./cmd/caam
          go test ./...

      - name: Push integration
        run: git push origin HEAD:integration

      - name: Open issue on conflict
        if: failure() && steps.merge.outputs.conflict != ''
        uses: actions/github-script@v7
        with:
          script: |
            const ref = '${{ steps.merge.outputs.conflict }}';
            const title = `fork-sync: conflict merging ${ref} into integration`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'fork-sync' });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['fork-sync'],
              body: `The scheduled sync could not merge \`${ref}\` into \`integration\`. Resolve locally on the integration branch and push, then re-run the workflow.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
